name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read # See ADR-001 for permissions rationale

jobs:
  quality-and-deploy:
    name: Quality and Deploy
    # Grant elevated permissions only at the job level for release operations per ADR-001
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: npm

      - name: Validate scripts non-empty
        run: node scripts/validate-scripts-nonempty.js

      - name: Install dependencies
        run: npm ci

      - name: Run full CI verification
        run: npm run ci-verify:full

      - name: Upload dry-aged deps artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dry-aged-deps-${{ matrix['node-version'] }}
          path: ci/dry-aged-deps.json

      - name: Upload npm audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: npm-audit-${{ matrix['node-version'] }}
          path: ci/npm-audit.json

      - name: Upload traceability report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report-${{ matrix['node-version'] }}
          path: scripts/traceability-report.md

      - name: Upload jest artifacts (primary)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jest-artifacts-${{ matrix['node-version'] }}
          path: ci/

      - name: Release with semantic-release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix['node-version'] == '20.x' && success() }}
        id: semantic-release
        run: |
          set -uo pipefail

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set. Skipping npm publish step."
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npx semantic-release 2>&1 | tee /tmp/release.log; then
            if grep -qE 'EINVALIDNPMTOKEN|Invalid npm token' /tmp/release.log; then
              echo "semantic-release failed due to invalid npm token. Skipping publish without failing CI."
              echo "new_release_published=false" >> "$GITHUB_OUTPUT"
              echo "new_release_version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -qE 'EOTP|one-time password' /tmp/release.log; then
              echo "semantic-release failed because npm requires a one-time password (EOTP). Skipping publish without failing CI."
              echo "new_release_published=false" >> "$GITHUB_OUTPUT"
              echo "new_release_version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "semantic-release failed. See logs above." >&2
            exit 1
          fi

          if grep -q "Published release" /tmp/release.log; then
            VERSION=$(grep "Published release" /tmp/release.log | sed -n 's/.*Published release[[:space:]]\+\([^[:space:]]*\).*/\1/p' | tail -n 1)

            if [ -n "$VERSION" ]; then
              echo "new_release_published=true" >> "$GITHUB_OUTPUT"
              echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Published version: $VERSION"
            else
              echo "Warning: semantic-release reported a published release but version could not be parsed." >&2
              echo "new_release_published=false" >> "$GITHUB_OUTPUT"
              echo "new_release_version=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
            echo "No new release published"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Smoke test published package
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ steps.semantic-release.outputs.new_release_version }}"

  dependency-health:
    if: ${{ github.event_name == 'schedule' }}
    name: Dependency Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Validate scripts non-empty
        run: node scripts/validate-scripts-nonempty.js

      - name: Install dependencies
        run: npm ci

      - name: Run dependency health audit
        run: npm run audit:dev-high